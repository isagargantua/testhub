services:
  - type: web
    name: testhub-auth-service
    runtime: node
    rootDir: auth-service
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: testhub-core-service
    runtime: node
    rootDir: core-service
    plan: starter
    buildCommand: npm install
    preDeployCommand: npm run deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: testhub-gateway
    runtime: node
    rootDir: gateway
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: testhub-auth-service
          property: hostport
      - key: CORE_SERVICE_URL
        fromService:
          type: web
          name: testhub-core-service
          property: hostport
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
