# ==========================================================================
#  testHub Selenium Hybrid Framework — default configuration
# --------------------------------------------------------------------------
#  Every key here can be overridden at runtime with a -D system property,
#  e.g.  mvn test -Dbrowser=firefox -Dheadless=true -Dbase.url=...
#  System properties always win over this file.
# ==========================================================================

# --- Application under test --------------------------------------------------
# Defaults to the LIVE deployment so the suite runs without a local stack.
# For a fully local run, override with:
#   -Dbase.url=http://localhost:5173 -Dapi.base.url=http://localhost:3000
base.url=https://mytesthub.vercel.app

# API gateway. Used by the RestAssured API layer for fast data seeding/cleanup.
# Local:  http://localhost:3000      Live: https://testhub-gateway.onrender.com
api.base.url=https://testhub-gateway.onrender.com

# --- Browser -----------------------------------------------------------------
# chrome | firefox | edge
browser=chrome
headless=false
# Comma-separated extra Chromium/Firefox args (optional)
browser.arguments=
# Browser window: maximize | <width>x<height>  (e.g. 1920x1080)
window.size=maximize

# --- Timeouts (seconds) ------------------------------------------------------
# Generous explicit-wait default — the free-tier backend can cold-start ~24s+.
timeout.explicit=40
timeout.pageload=60
#timeout.polling.millis=300 
timeout.polling.millis=1000

# --- Test users (existing, standing accounts) ---------------------------------
admin.email=admin14@gmail.com
admin.password=adminadmin
tester.email=testuser1@gmail.com
tester.password=Tester1

# --- User session mode -------------------------------------------------------
# true (default) — UI tests sign in through the login form with the standing
#   tester.email / tester.password above. No registration → never hits the live
#   free-tier 429 throttle on /api/auth/register.
# false — each test registers a brand-new throwaway account through the sign-up
#   form. Maximum isolation, but bursty runs can trip the register throttle.
# NOTE: tests that assert fresh-account state (e.g. DashboardTest's zero KPIs)
#   always register fresh regardless of this flag.
reuse.user=true

# --- Reporting / artifacts ---------------------------------------------------
# Which report(s) to produce: extent | allure | both
#   extent → test-output/reports/Latest/Report-*.html (self-contained HTML)
#   allure → target/allure-results (view with: mvn allure:serve)
#   both   → both of the above
# Override per run:  mvn test -Dreport.type=allure
report.type=both
screenshot.on.failure=true
screenshot.on.success=true
# Set screenshot.on.success=true for a full visual audit (report will be larger)
report.open.after.run=false

# --- Retry -------------------------------------------------------------------
# Cold-start / flaky-network safety net. 0 disables retries.
retry.count=1

# --- API warm-up -------------------------------------------------------------
# Ping the gateway before the suite so the first UI action doesn't eat a cold
# start. Set false when running fully local.
warmup.enabled=true
